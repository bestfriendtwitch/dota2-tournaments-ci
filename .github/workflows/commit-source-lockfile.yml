name: Commit canonical lockfile to private source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/commit-source-lockfile.yml']

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: bestfriendtwitch/dota2-tournaments
  SOURCE_BRANCH: agent/pnpm-lockfile-frozen-ci
  EXPECTED_SOURCE_HEAD: 72da5babb83706a1145829e09503e3e55cf7d55f
  LOCK_SHA256: 3960ab633b2816057235383bab061aa22d578610d0de1c21b5a551b503208c66

jobs:
  commit-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical public lockfile
        uses: actions/checkout@v4
        with:
          ref: 1cd80377e6ea979e9c2c45ffaafe878ef84943d4
          persist-credentials: false
          fetch-depth: 1
          path: mirror

      - name: Checkout private source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ secrets.DOTA_LIGA_SOURCE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: source

      - name: Verify source head and canonical lockfile
        shell: bash
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test "$(sha256sum mirror/pnpm-lock.yaml | awk '{print $1}')" = "$LOCK_SHA256"

      - name: Commit exact canonical lockfile to private source
        shell: bash
        run: |
          cp mirror/pnpm-lock.yaml source/pnpm-lock.yaml
          cd source
          test "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" = "$LOCK_SHA256"
          git config user.name "dota-liga-ci"
          git config user.email "dota-liga-ci@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --exit-code >/dev/null && { echo "Lockfile already committed"; exit 0; }
          git commit -m "chore: commit canonical pnpm lockfile"
          git push origin "HEAD:$SOURCE_BRANCH"
