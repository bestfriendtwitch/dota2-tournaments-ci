name: Export canonical lockfile bytes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/commit-source-lockfile.yml']

permissions:
  contents: read

jobs:
  export-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1cd80377e6ea979e9c2c45ffaafe878ef84943d4
          persist-credentials: false
          fetch-depth: 1

      - name: Verify canonical file
        run: |
          echo "3960ab633b2816057235383bab061aa22d578610d0de1c21b5a551b503208c66  pnpm-lock.yaml" | sha256sum -c -

      - name: Export canonical file as base64 chunks
        shell: bash
        run: |
          echo LOCK_B64_BEGIN
          base64 -w 40000 pnpm-lock.yaml
          echo LOCK_B64_END
