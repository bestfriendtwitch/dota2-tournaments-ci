name: Export canonical lockfile artifact

on:
  push:
    branches: [main]
    paths: ['.github/workflows/commit-source-lockfile.yml']

permissions:
  contents: read

jobs:
  export-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1cd80377e6ea979e9c2c45ffaafe878ef84943d4
          persist-credentials: false
          fetch-depth: 1

      - name: Verify canonical file
        run: |
          echo "3960ab633b2816057235383bab061aa22d578610d0de1c21b5a551b503208c66  pnpm-lock.yaml" | sha256sum -c -
          echo "LOCK_BYTES=$(wc -c < pnpm-lock.yaml)"
          echo "LOCK_B64_BYTES=$(base64 -w0 pnpm-lock.yaml | wc -c)"

      - name: Upload exact canonical lockfile
        uses: actions/upload-artifact@v4
        with:
          name: canonical-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
