name: Private source browser CI

on:
  push:
    branches: [main]
    paths: ['.github/workflows/private-source-browser-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: bestfriendtwitch/dota2-tournaments
  SOURCE_SHA: 4d815daa08b4c5e3ba30a7ac783692b2d02a0f8b
  LOCK_REPOSITORY: bestfriendtwitch/dota2-tournaments-ci
  LOCK_SHA: 1cd80377e6ea979e9c2c45ffaafe878ef84943d4
  LOCK_SHA256: 3960ab633b2816057235383bab061aa22d578610d0de1c21b5a551b503208c66

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LOCK_REPOSITORY }}
          ref: ${{ env.LOCK_SHA }}
          persist-credentials: false
          fetch-depth: 1
          path: mirror
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.DOTA_LIGA_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Pin generated lockfile
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum ../mirror/pnpm-lock.yaml | awk '{print $1}')" = "$LOCK_SHA256"
          cp ../mirror/pnpm-lock.yaml pnpm-lock.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker-compose.dev.yml up -d
      - run: bash infra/scripts/migrate-local.sh
      - run: pnpm --filter @dota-liga/api build
      - run: pnpm --filter @dota-liga/e2e exec playwright install --with-deps chromium
      - name: Run full Chromium suite to first failure
        shell: bash
        env:
          NODE_ENV: test
          API_HOST: 127.0.0.1
          API_PORT: '3001'
          DATABASE_URL: postgres://dota_liga:dota_liga_dev@127.0.0.1:5432/dota_liga
          REDIS_URL: redis://127.0.0.1:6379
          SESSION_SECRET: browser-e2e-session-secret-000000000000000000
          OWNER_DISCORD_USER_ID: '975000000000000005'
          WEB_ORIGIN: http://127.0.0.1:3000
          NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:3001
        run: |
          set +e
          : > ../target-api.log
          : > ../target-web.log
          : > ../target-playwright.log
          node apps/api/dist/main.js > ../target-api.log 2>&1 &
          api_pid=$!
          setsid pnpm --filter @dota-liga/web exec next dev --hostname 127.0.0.1 --port 3000 > ../target-web.log 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$api_pid" >/dev/null 2>&1 || true
            kill -- -"$web_pid" >/dev/null 2>&1 || kill "$web_pid" >/dev/null 2>&1 || true
            wait "$api_pid" >/dev/null 2>&1 || true
            wait "$web_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          api_ready=0
          web_ready=0
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3001/health/live >/dev/null 2>&1; then api_ready=1; fi
            if curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then web_ready=1; fi
            if [ "$api_ready" -eq 1 ] && [ "$web_ready" -eq 1 ]; then break; fi
            sleep 1
          done
          if [ "$api_ready" -ne 1 ] || [ "$web_ready" -ne 1 ]; then
            echo "Manual servers failed readiness: api=$api_ready web=$web_ready" | tee -a ../target-playwright.log
            exit 1
          fi
          CI= pnpm --filter @dota-liga/e2e exec playwright test --project=chromium --workers=1 --retries=0 --max-failures=1 --reporter=line 2>&1 | tee ../target-playwright.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo '=== PLAYWRIGHT ==='; tail -n 1800 ../target-playwright.log
            echo '=== API ==='; tail -n 3000 ../target-api.log
            echo '=== WEB ==='; tail -n 1400 ../target-web.log
          fi
          exit "$rc"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-browser-first-failure-${{ env.SOURCE_SHA }}
          path: |
            source/apps/e2e/playwright-report
            source/apps/e2e/test-results
            target-api.log
            target-web.log
            target-playwright.log
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: docker compose -f docker-compose.dev.yml down -v
