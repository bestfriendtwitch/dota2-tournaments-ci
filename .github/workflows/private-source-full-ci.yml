name: Private source full CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: bestfriendtwitch/dota2-tournaments
  SOURCE_SHA: afd8b8fdc313c6adcccae5e601028639e3b122b0
  LOCK_REPOSITORY: bestfriendtwitch/dota2-tournaments-ci
  LOCK_SHA: 1cd80377e6ea979e9c2c45ffaafe878ef84943d4
  LOCK_SHA256: 3960ab633b2816057235383bab061aa22d578610d0de1c21b5a551b503208c66

jobs:
  legacy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.DOTA_LIGA_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  platform-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout pinned public lockfile snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LOCK_REPOSITORY }}
          ref: ${{ env.LOCK_SHA }}
          persist-credentials: false
          fetch-depth: 1
          path: mirror
      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.DOTA_LIGA_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Pin and verify generated lockfile
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum ../mirror/pnpm-lock.yaml | awk '{print $1}')" = "$LOCK_SHA256"
          cp ../mirror/pnpm-lock.yaml ./pnpm-lock.yaml
          test "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" = "$LOCK_SHA256"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './apps/**' --filter './packages/**' typecheck
      - run: pnpm --filter @dota-liga/api test:unit
      - name: Production deployment static validation
        run: bash infra/scripts/test-production-deploy-static.sh
      - name: Production operations static validation
        run: bash infra/scripts/test-production-operations-static.sh
      - run: docker compose -f docker-compose.dev.yml up -d
      - run: bash infra/scripts/migrate-local.sh
      - name: PostgreSQL backup/restore drill
        run: |
          bash -n infra/scripts/lib/postgres-common.sh
          bash -n infra/scripts/postgres-backup.sh
          bash -n infra/scripts/postgres-restore.sh
          bash -n infra/scripts/postgres-restore-drill.sh
          bash -n infra/scripts/test-postgres-backup-restore-ci.sh
          bash infra/scripts/test-postgres-backup-restore-ci.sh
      - run: bash infra/scripts/run-api-integration-ci.sh
      - run: pnpm --filter @dota-liga/worker test:integration
      - run: pnpm --filter @dota-liga/api build
      - run: pnpm --filter @dota-liga/worker build
      - run: pnpm --filter @dota-liga/web build
      - if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout pinned public lockfile snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LOCK_REPOSITORY }}
          ref: ${{ env.LOCK_SHA }}
          persist-credentials: false
          fetch-depth: 1
          path: mirror
      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.DOTA_LIGA_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Pin and verify generated lockfile
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum ../mirror/pnpm-lock.yaml | awk '{print $1}')" = "$LOCK_SHA256"
          cp ../mirror/pnpm-lock.yaml ./pnpm-lock.yaml
          test "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" = "$LOCK_SHA256"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker-compose.dev.yml up -d
      - run: bash infra/scripts/migrate-local.sh
      - run: pnpm --filter @dota-liga/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @dota-liga/e2e test
      - if: always()
        run: docker compose -f docker-compose.dev.yml down -v
