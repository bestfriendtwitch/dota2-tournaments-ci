name: Private source platform CI

on:
  push:
    branches: [main]
    paths:
      - 'ci-target.json'
      - '.github/workflows/private-source-platform-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: bestfriendtwitch/dota2-tournaments

jobs:
  platform-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CI control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Resolve exact private source target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('control/ci-target.json').read_text())
          print(data['source_sha'])
          PY
          )"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid source_sha" >&2; exit 1; }
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          echo "Validating private source SHA: $source_sha"

      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ steps.target.outputs.source_sha }}
          token: ${{ secrets.DOTA_LIGA_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify exact source and committed lockfile
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.source_sha }}"
          test -s pnpm-lock.yaml
          test -z "$(git status --short -- pnpm-lock.yaml)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - working-directory: source
        run: pnpm install --frozen-lockfile

      - working-directory: source
        run: pnpm -r --filter './apps/**' --filter './packages/**' typecheck

      - working-directory: source
        run: pnpm --filter @dota-liga/web lint

      - working-directory: source
        run: pnpm --filter @dota-liga/api test:unit

      - name: Production deployment static validation
        working-directory: source
        run: bash infra/scripts/test-production-deploy-static.sh

      - name: Production operations static validation
        working-directory: source
        run: bash infra/scripts/test-production-operations-static.sh

      - working-directory: source
        run: docker compose -f docker-compose.dev.yml up -d

      - working-directory: source
        run: bash infra/scripts/migrate-local.sh

      - name: PostgreSQL backup/restore drill
        working-directory: source
        shell: bash
        run: |
          bash -n infra/scripts/lib/postgres-common.sh
          bash -n infra/scripts/postgres-backup.sh
          bash -n infra/scripts/postgres-restore.sh
          bash -n infra/scripts/postgres-restore-drill.sh
          bash -n infra/scripts/test-postgres-backup-restore-ci.sh
          bash infra/scripts/test-postgres-backup-restore-ci.sh

      - working-directory: source
        run: bash infra/scripts/run-api-integration-ci.sh

      - working-directory: source
        run: pnpm --filter @dota-liga/worker test:integration

      - working-directory: source
        run: pnpm --filter @dota-liga/api build

      - working-directory: source
        run: pnpm --filter @dota-liga/worker build

      - working-directory: source
        run: pnpm --filter @dota-liga/web build

      - if: always()
        working-directory: source
        run: docker compose -f docker-compose.dev.yml down -v
