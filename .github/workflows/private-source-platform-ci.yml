name: Private source platform CI

on:
  push:
    branches: [main]
    paths:
      - 'ci-target.json'
      - '.github/workflows/private-source-platform-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: bestfriendtwitch/dota2-tournaments

jobs:
  platform-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout CI control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Resolve exact private source target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import json
          import shlex
          from pathlib import Path
          data = json.loads(Path('control/ci-target.json').read_text())
          print('source_sha=' + shlex.quote(str(data['source_sha'])))
          print('purpose=' + shlex.quote(str(data.get('purpose', ''))))
          PY
          )"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid source_sha" >&2; exit 1; }
          [[ ${#purpose} -le 160 ]] || { echo "purpose too long" >&2; exit 1; }
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'purpose=%s\n' "$purpose" >> "$GITHUB_OUTPUT"
          echo "Validating private source SHA: $source_sha"
          echo "Validation purpose: $purpose"

      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ steps.target.outputs.source_sha }}
          token: ${{ secrets.DOTA_LIGA_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify exact source and committed lockfile
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.source_sha }}"
          test -s pnpm-lock.yaml
          test -z "$(git status --short -- pnpm-lock.yaml)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - working-directory: source
        run: pnpm install --frozen-lockfile

      - working-directory: source
        run: pnpm -r --filter './apps/**' --filter './packages/**' typecheck

      - working-directory: source
        run: pnpm --filter @dota-liga/web lint

      - working-directory: source
        run: pnpm --filter @dota-liga/api test:unit

      - name: Production deployment static validation
        working-directory: source
        run: bash infra/scripts/test-production-deploy-static.sh

      - name: Production operations static validation
        working-directory: source
        run: bash infra/scripts/test-production-operations-static.sh

      - working-directory: source
        run: docker compose -f docker-compose.dev.yml up -d

      - working-directory: source
        run: bash infra/scripts/migrate-local.sh

      - name: PostgreSQL backup/restore drill
        working-directory: source
        shell: bash
        run: |
          bash -n infra/scripts/lib/postgres-common.sh
          bash -n infra/scripts/postgres-backup.sh
          bash -n infra/scripts/postgres-restore.sh
          bash -n infra/scripts/postgres-restore-drill.sh
          bash -n infra/scripts/test-postgres-backup-restore-ci.sh
          bash infra/scripts/test-postgres-backup-restore-ci.sh

      - working-directory: source
        run: bash infra/scripts/run-api-integration-ci.sh

      - working-directory: source
        run: pnpm --filter @dota-liga/worker test:integration

      - working-directory: source
        run: pnpm --filter @dota-liga/api build

      - working-directory: source
        run: pnpm --filter @dota-liga/worker build

      - working-directory: source
        run: pnpm --filter @dota-liga/web build

      - name: QA staging static validation
        if: startsWith(steps.target.outputs.purpose, 'qa-')
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/qa/up.sh
          bash -n infra/qa/down.sh
          bash -n infra/qa/print-codex-mcp-config.sh
          node --check apps/e2e/qa/seed.mjs
          QA_HOST_UID="$(id -u)" QA_HOST_GID="$(id -g)" docker compose -f docker-compose.qa.yml config >/dev/null

      - name: QA staging runtime smoke
        if: startsWith(steps.target.outputs.purpose, 'qa-')
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash infra/qa/up.sh
          test -s .qa-state/owner.json
          test -s .qa-state/captain1.json
          test -s .qa-state/captain2.json
          test -s .qa-state/player01.json
          test -s .qa-state/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('.qa-state/manifest.json').read_text())
          assert manifest['scenario'] == 'draft-ready'
          assert manifest['participantCount'] == 10
          assert manifest['expectedCheckIns'] == 10
          assert set(manifest['users']) == {'owner', 'captain1', 'captain2', 'player01'}
          for role in manifest['users']:
              state = json.loads(Path(f'.qa-state/{role}.json').read_text())
              names = {cookie['name'] for cookie in state['cookies']}
              assert names == {'dota_liga_session', 'dota_liga_csrf'}
          PY
          test "$(stat -c '%a' .qa-state)" = "700"
          for state in .qa-state/*.json; do test "$(stat -c '%a' "$state")" = "600"; done
          curl --fail --silent --show-error http://127.0.0.1:3380/api/v1/me \
            --cookie "dota_liga_session=$(python3 - <<'PY'
          import json
          print(next(c['value'] for c in json.load(open('.qa-state/owner.json'))['cookies'] if c['name'] == 'dota_liga_session'))
          PY
          )" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["user"]["siteRole"] == "OWNER"'

      - name: Destroy QA staging runtime
        if: always() && startsWith(steps.target.outputs.purpose, 'qa-')
        working-directory: source
        shell: bash
        run: bash infra/qa/down.sh

      - if: always()
        working-directory: source
        run: docker compose -f docker-compose.dev.yml down -v
